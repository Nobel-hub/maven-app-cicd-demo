name: Maven CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup JDK 11 + Maven cache
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Build & Test (clean + verify runs tests + generates reports for Sonar)
      - name: Maven Build & Test
        run: mvn -f pom.xml clean verify -DskipITs

      # 4. Upload WAR artifact (optional - keep for debugging or later steps)
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-war
          path: target/*.war

      # 5. Checkstyle Analysis (optional if already bound in pom)
      - name: Checkstyle
        run: mvn -f pom.xml checkstyle:checkstyle

      # 6. SonarQube Scan (using modern plugin coordinates)
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=java-tomcat-sample \
            -Dsonar.projectName="java-tomcat-sample" \
            -Dsonar.projectVersion=4.0 \
            -Dsonar.host.url=http://18.206.64.158:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.sources=src/ \
            -Dsonar.junit.reportsPath=target/surefire-reports/ \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml   # if you added jacoco plugin

      # ────────────────────────────────────────────────────────────────
      # 7. Deploy WAR to Nexus using mvn deploy:deploy-file
      #    → Creates temp settings.xml for auth
      # ────────────────────────────────────────────────────────────────
      - name: Deploy WAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          # Create temporary Maven settings.xml with credentials
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

          # Deploy with proper Maven coordinates
          VERSION="ci-${{ github.run_id }}"

          mvn deploy:deploy-file \
            -s ~/.m2/settings.xml \
            -DrepositoryId=nexus \
            -Durl=http://44.203.253.157:8081/repository/myjavaapp/ \
            -Dfile=target/java-tomcat-maven-example.war \
            -DgroupId=com.builds.ci \
            -DartifactId=java-tomcat-sample \
            -Dversion=${VERSION} \
            -Dpackaging=war \
            -DgeneratePom=true

          echo "Artifact should now appear at:"
          echo "com/builds/ci/java-tomcat-sample/${VERSION}/java-tomcat-sample-${VERSION}.war"
