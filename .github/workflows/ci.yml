name: Maven CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup JDK 11 + Maven cache
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Build & Test (skip tests first if you want, but better to run them for Sonar)
      - name: Maven Build & Test
        run: mvn -f pom.xml clean verify -DskipITs  # or just 'verify' if you want integration tests too

      # 4. Upload WAR artifact (optional - for later use)
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-war
          path: target/*.war

      # 5. Checkstyle Analysis (already done in verify if plugin bound, but explicit if needed)
      - name: Checkstyle
        run: mvn -f pom.xml checkstyle:checkstyle

      # 6. SonarQube Scan (using modern Maven plugin + token)
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=java-tomcat-sample \
            -Dsonar.projectName="java-tomcat-sample" \
            -Dsonar.projectVersion=4.0 \
            -Dsonar.host.url=http://18.206.64.158:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.sources=src/ \
            -Dsonar.junit.reportsPath=target/surefire-reports/ \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml   # ← add if you have JaCoCo

      # 7. Upload WAR to Nexus (your exact repo + dynamic name)
      - name: Upload WAR to Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "Uploading WAR to Nexus..."
          curl -v -u $NEXUS_USER:$NEXUS_PASS \
            --upload-file target/java-tomcat-maven-example.war \
            http://44.203.253.157:8081/repository/myjavaapp/java-tomcat-sample-${{ github.run_id }}.war
